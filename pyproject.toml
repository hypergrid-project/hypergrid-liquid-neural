[project]
name = "hg-model"
version = "0.1.0"
description = "HyperGrid Road Surface Anomaly & Pothole Detection Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "folium>=0.14.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "onnx>=1.15.0",
    "onnxmltools>=1.12.0",
    "onnxruntime>=1.17.0",
    "onnxscript>=0.7.2",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
    "skl2onnx>=1.16.0",
    "supabase>=2.3.0",
    "torch>=2.2.0",
    "xgboost>=2.0.0",
]

[project.optional-dependencies]
edge = [
    "ncps>=0.0.7",
    "onnx2tf>=1.20.0",
    "tensorflow>=2.15.0",
]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]
